<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Decode — Connected</title>
<link rel="icon" href="app-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F1; --ink:#15171A; --ink-soft:#5B6066; --line:#E2E0D6; --accent:#3552FF; --accent-soft:#EAEDFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16.5px;line-height:1.6;display:flex;min-height:100vh;align-items:center;justify-content:center;}
  .card{max-width:480px;width:100%;margin:24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;}
  h1{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;margin:0 0 10px;}
  p{color:var(--ink-soft);margin:0 0 22px;font-size:15px;}
  .label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .codebox{
    font-family:'IBM Plex Mono',monospace;font-size:14px;background:var(--accent-soft);color:var(--ink);
    padding:14px 16px;border-radius:10px;word-break:break-all;margin-bottom:18px;border:1px solid var(--line);
    user-select:all;
  }
  .err{color:#C0392B;}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:none;
    padding:11px 18px;border-radius:9px;cursor:pointer;
  }
  button:active{opacity:.85;}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>You're connected to Decode</h1>
    <p id="intro">This page only runs on your device — it reads the response TikTok just sent back and shows it to you so it can be copied into Decode.</p>

    <div id="result"></div>

    <div class="hint">You can close this tab once you've copied what you need.</div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const returnedState = params.get('state');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  const result = document.getElementById('result');

  const savedVerifier = sessionStorage.getItem('decode_code_verifier');
  const savedState = sessionStorage.getItem('decode_state');

  function block(label, value, isError, withCopy){
    const wrap = document.createElement('div');
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'codebox' + (isError ? ' err' : '');
    v.textContent = value;
    wrap.appendChild(l);
    wrap.appendChild(v);
    if (withCopy) {
      const btn = document.createElement('button');
      btn.textContent = 'Copy';
      btn.style.marginBottom = '18px';
      btn.onclick = () => navigator.clipboard.writeText(value);
      wrap.appendChild(btn);
    }
    result.appendChild(wrap);
  }

  if (error) {
    block('Error', error + (errorDesc ? ' — ' + errorDesc : ''), true, false);
  } else if (code) {
    block('Authorization code', code, false, true);

    if (savedVerifier) {
      block('Code verifier (needed to exchange the code for a token)', savedVerifier, false, true);
    } else {
      block('Notice', 'No code_verifier found in this browser session — the "Connect" flow must be started from index.html in the same tab.', true, false);
    }

    if (returnedState && savedState && returnedState !== savedState) {
      block('Warning', 'The returned state did not match the one this session generated.', true, false);
    }
  } else {
    block('Notice', 'No authorization code was found in this URL.', true, false);
  }
</script>
</body>
</html>
